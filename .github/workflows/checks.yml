name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run static checks
        run: python3 tools/check_designs.py

  browser:
    name: Browser checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Selenium
        run: python3 -m pip install --disable-pip-version-check selenium
      - name: Check the browser stack
        run: |
          firefox --version
          geckodriver --version
      - name: Run browser checks
        run: python3 tools/check_designs.py --browser
